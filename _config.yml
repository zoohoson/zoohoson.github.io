# HOLOG — Jekyll + Hydejack v9 (Free, gem 테마)
# Hydejack 6.4.0(2017) 설정값을 v9 키로 옮김. 실행·배포는 README.md

# Site
title:               HOLOG
url:                 https://zoohoson.github.io
baseurl:             ""
lang:                ko
description:         >
  AI ML Engineer, Data Scientist
tagline:             ""
keywords:            []

author:
  name:              ZooHo
  email:             zoohoson@gmail.com

copyright:           '&copy; 2021. by ZooHo'

# Theme
theme:               jekyll-theme-hydejack
accent_image:        /assets/img/back.jpg
accent_color:        '#4f86aa'
theme_color:         '#4f86aa'
favicon:             /favicon.ico
font_heading:        "'Lato', 'Sans-serif'"
font:                "'Lato', 'Sans-serif'"
google_fonts:        Lato

# Comments: 기존 Disqus 스레드 연결을 위해 _includes/my-comments.html에서 identifier(page.id)를 지정
disqus:              zooho

# Analytics: v9 내장 analytics는 UA(analytics.js) 전용 → _includes/body/analytics.html을 GA4로 덮어씀
ga4_measurement_id:  G-4QJJTRVPXK

# URL: Hydejack 6 시절과 동일하게 유지(바꾸면 기존 색인·외부 링크가 깨짐)
permalink:           pretty
paginate:            8
paginate_path:       '/page-:num/'

collections:
  featured_categories:
    permalink:       /category/:name/
    output:          true
  featured_tags:
    permalink:       /tag/:name/
    output:          true

defaults:
  - scope:
      path:          assets/
    values:
      sitemap:       false
  - scope:
      path:          googled66f3a3d049db10d.html
    values:
      sitemap:       false
  - scope:
      path:          naverc160a64d2728f54f2d946dc46e3c785a.html
    values:
      sitemap:       false
  - scope:
      type:          featured_categories
    values:
      seo:
        type:        WebPage
  - scope:
      type:          featured_tags
    values:
      seo:
        type:        WebPage

kramdown:
  footnote_backlink: '&#x21a9;&#xfe0e;'
  # 수식: `math_engine: mathjax`를 켜면 Hydejack이 MathJax(약 770KB)를 모든 페이지에서 로드한다.
  # 수식 글이 생길 때 KaTeX 서버 렌더링(kramdown-math-katex, node 필요) 또는 MathJax 중 결정
  # math_engine:       mathjax

hydejack:
  post_addons:       [about, related, random, comments]
  no_mark_external:  false
  no_push_state:     false   # AdSense를 붙일 때는 true 검토(페이지 전환 시 광고 재로딩 문제)
  no_drawer:         false
  no_navbar:         false
  no_inline_css:     false
  no_page_style:     false
  no_break_layout:   true
  no_third_column:   false
  no_large_headings: false
  no_structured_data: false
  no_theme_color:    false
  no_breadcrumbs:    true    # Hydejack 6처럼 숨김(중간 경로 /dlog/2023/ 등은 페이지가 없어 링크가 깨짐)
  use_lsi:           false
  cookies_banner:    false
  advertise:         false
  hide_dates:        false
  hide_last_modified: false
  dark_mode:
    always:          false
    dynamic:         true
    icon:            true

# Search: 기존 tipuesearch(/search/) 유지. 스크립트는 검색 페이지에서만 로드
tipue_search:
  include:
    pages:           false
    collections:     []
  exclude:
    files:           [search.html, index.html, tags.html]
    categories:      []
    tags:            []

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-last-modified-at

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  # 비공개 전환한 기사 스크랩(_posts/article, published: false)의 이미지. 파일은 저장소에 남기고 배포에서만 제외
  - "assets/img/2[0-9][0-9][0-9][0-9][0-9]*"

compress_html:
  comments:          ["<!--", "-->"]
  clippings:         all
  endings:           all
  ignore:
    envs:            [development]

sass:
  style:             compressed
  quiet_deps:        true
  # 테마 SCSS의 @import 사용 중단 경고(Dart Sass 3.0에서 제거 예정, 테마 측 수정 필요) 숨김
  silence_deprecations: [import, global-builtin, color-functions, slash-div]
