{%- comment -%}
  HOLOG: 테마 원본은 UA(analytics.js) 전용이라 GA4(gtag.js)로 대체.
  push-state 페이지 전환은 GA4 향상된 측정(브라우저 기록 이벤트 기반 페이지 변경, 기본 켜짐)이 page_view로 수집한다.
{%- endcomment -%}
{% if site.ga4_measurement_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga4_measurement_id }}');
</script>
{% endif %}
